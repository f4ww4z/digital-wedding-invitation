name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: npm install -g node-gyp@12
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  docker:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build api image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: api
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: web
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  e2e:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Configure .env for a local HTTP test run
        run: |
          cp .env.example .env
          sed -i "s|^SESSION_SECRET=.*|SESSION_SECRET=$(openssl rand -base64 48 | tr -d '\n/+=')|" .env
          sed -i "s|^ADMIN_PASSWORD=.*|ADMIN_PASSWORD=ci-e2e-password-123|" .env
          sed -i "s|^COOKIE_SECURE=.*|COOKIE_SECURE=false|" .env
      - name: Start stack
        run: docker compose up -d --build --wait
      - run: npm install -g node-gyp@12
      - run: pnpm install --frozen-lockfile
      - name: Run e2e (system Chrome)
        run: pnpm test:e2e
        env:
          ADMIN_PASSWORD: ci-e2e-password-123
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
