# Served by nginx-unprivileged (runs as uid 101, listens on 8080).
# Static SPA + reverse proxy to the internal API service.

server_tokens off;

upstream sakinah_api {
  server api:3000;
  keepalive 16;
}

server {
  listen 8080;
  listen [::]:8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 64k;
  client_body_timeout 15s;
  client_header_timeout 15s;
  keepalive_timeout 30s;
  send_timeout 30s;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

  # ---- Security headers for the app shell / static files ----
  set $csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; font-src 'self' data:; connect-src 'self'; frame-src https://www.google.com https://maps.google.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";
  add_header Content-Security-Policy $csp always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), accelerometer=(self), gyroscope=(self), magnetometer=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok";
  }

  # ---- API ----
  location /api/ {
    proxy_pass http://sakinah_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    client_max_body_size 256k;
    # API sets its own security headers (helmet); do not duplicate CSP here.
    add_header X-Content-Type-Options "nosniff" always;
  }

  # Admin JSON (content editor, guest import) is larger than public payloads.
  location /api/admin/ {
    proxy_pass http://sakinah_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    client_max_body_size 640k;
    add_header X-Content-Type-Options "nosniff" always;
  }

  # Media uploads (admin only, enforced by the API) need a larger body limit.
  location = /api/admin/media {
    proxy_pass http://sakinah_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_request_buffering off;
    proxy_read_timeout 120s;
    client_max_body_size 105m;
    add_header X-Content-Type-Options "nosniff" always;
  }

  # Uploaded media served by the API (immutable, random filenames).
  location /media/ {
    proxy_pass http://sakinah_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    limit_except GET HEAD { deny all; }
    add_header X-Content-Type-Options "nosniff" always;
  }

  # Hashed build assets: cache forever.
  location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  location /demo/ {
    try_files $uri =404;
    expires 7d;
    add_header X-Content-Type-Options "nosniff" always;
  }

  # SPA fallback. index.html must never be cached so new deploys are picked up.
  location / {
    try_files $uri /index.html;
    # Splice dynamic <head> tags (title, Open Graph) into index.html.
    ssi on;
    ssi_types text/html;
    add_header Cache-Control "no-cache" always;
    add_header Content-Security-Policy $csp always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), accelerometer=(self), gyroscope=(self), magnetometer=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
  }

  # robots.txt follows the admin's "Allow search engines" setting.
  location = /robots.txt {
    proxy_pass http://sakinah_api/api/robots.txt;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
  }

  # Missing static text/data files are real 404s, not the SPA shell.
  location ~* \.(txt|xml|json|webmanifest|map)$ {
    try_files $uri =404;
  }

  # Never serve dotfiles.
  location ~ /\. {
    deny all;
    return 404;
  }
}
