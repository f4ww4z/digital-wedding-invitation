# Sakinah Digital Invitation — production compose file.
#   cp .env.example .env   # then edit it
#   docker compose up -d --build
# Only the `web` service publishes a port. The API sits on an internal network
# with no route to the internet.

name: sakinah

x-hardening: &hardening
  read_only: true
  init: true
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  api:
    <<: *hardening
    build:
      context: .
      target: api
    image: sakinah/api:${IMAGE_TAG:-latest}
    env_file: .env
    environment:
      NODE_ENV: production
      API_PORT: "3000"
      API_HOST: "0.0.0.0"
      DATA_DIR: /data
      UPLOAD_DIR: /uploads
      TZ: ${TZ:-Asia/Jakarta}
    volumes:
      - sakinah-data:/data
      - sakinah-uploads:/uploads
    tmpfs:
      - /tmp:size=128m,mode=1777,noexec,nosuid,nodev
    networks:
      - backend
    user: "1000:1000"
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 200
    ulimits:
      nofile: { soft: 4096, hard: 8192 }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  web:
    <<: *hardening
    build:
      context: .
      target: web
    image: sakinah/web:${IMAGE_TAG:-latest}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${PUBLIC_BIND:-0.0.0.0}:${PUBLIC_PORT:-8080}:8080"
    tmpfs:
      - /tmp:size=64m,mode=1777,noexec,nosuid,nodev
    networks:
      - frontend
      - backend
    user: "101:101"
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 100
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

networks:
  frontend: {}
  backend:
    internal: true

volumes:
  sakinah-data: {}
  sakinah-uploads: {}
